name: ipaper
services:
  ipaper:
    image: ifzzh520/ipaper:1.13.3@sha256:e6189b458159938b12ce2bd7e9a92d923b7e2384d6d40c7cdf2d52741cea504c
    container_name: ipaper
    ports:
      - "127.0.0.1:7191:7191"
    env_file:
      - /mnt/raid1/projects/ipaper/deploy/.env
    environment:
      IPAPER_ENV: ${IPAPER_ENV:-production}
      IPAPER_AUTH_MODE: ${IPAPER_AUTH_MODE:-local}
      IPAPER_COOKIE_SECURE: ${IPAPER_COOKIE_SECURE:-true}
      IPAPER_PAPERS_DIR: /data/papers
      IPAPER_TRANSLATION_WORKER_URL: http://ipaper-translation-worker:7192
      IPAPER_TRANSLATION_JOBS_ROOT: /work/jobs
      IPAPER_WORKER_TOKEN_FILE: /run/secrets/ipaper_worker_token
      IPAPER_SETTINGS_KEY_FILE: /run/secrets/ipaper_settings_key
      IPAPER_DOCUMENT_WORKER_URL: http://ipaper-document-worker:7193
      IPAPER_DOCUMENT_JOBS_ROOT: /work/document-jobs
      IPAPER_DOCUMENT_WORKER_TOKEN_FILE: /run/secrets/ipaper_document_worker_token
      IPAPER_MAX_PDF_BYTES: 104857600
      IPAPER_MAX_ARCHIVE_BYTES: 209715200
      IPAPER_MAX_ARCHIVE_EXPANDED_BYTES: 2147483648
      IPAPER_MAX_ARCHIVE_ENTRIES: 2000
      IPAPER_MAX_IMPORT_PAPERS: 500
      IPAPER_AI_ALLOWED_ORIGINS: ${IPAPER_AI_ALLOWED_ORIGINS:-}
      IPAPER_AI_PRIVATE_ALLOWED_ORIGINS: ${IPAPER_AI_PRIVATE_ALLOWED_ORIGINS:-}
      IPAPER_AI_PROXY_FAKE_IP_RANGES: ${IPAPER_AI_PROXY_FAKE_IP_RANGES:-}
      IPAPER_MINERU_TRANSFER_ALLOWED_ORIGINS: ${IPAPER_MINERU_TRANSFER_ALLOWED_ORIGINS:-}
    volumes:
      - /mnt/raid1/projects/ipaper/deploy/.env:/app/.env:ro
      - /srv/ifserver-fast/ipaper/runtime/db:/app/db
      - /mnt/raid1/projects/ipaper/data/papers:/data/papers
      - /mnt/raid1/projects/ipaper/data/staging/translation:/work/jobs
      - document_jobs:/work/document-jobs
    secrets:
      - ipaper_worker_token
      - source: ipaper_settings_key
        target: ipaper_settings_key
        uid: "10001"
        gid: "1001"
        mode: 0440
      - source: ipaper_document_worker_token
        target: ipaper_document_worker_token
        uid: "10001"
        gid: "1001"
        mode: 0440
    depends_on:
      ipaper-translation-worker:
        condition: service_healthy
      ipaper-document-worker:
        condition: service_healthy
    networks:
      - default
      - document_internal
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 3.0
    mem_limit: 3g
    pids_limit: 256
    stop_grace_period: 35s
    restart: unless-stopped

  ipaper-translation-worker:
    image: ifzzh520/ipaper-translation-worker:1.2.0@sha256:a5fa3b4316802c15e99a7387baa49604166fb6092a1aca34b8c5e34de3d52003
    container_name: ipaper-translation-worker
    environment:
      IPAPER_WORKER_JOBS_ROOT: /work/jobs
      IPAPER_WORKER_TOKEN_FILE: /run/secrets/ipaper_worker_token
    volumes:
      - /mnt/raid1/projects/ipaper/data/staging/translation:/work/jobs
    secrets:
      - ipaper_worker_token
    expose:
      - "7192"
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 4.0
    mem_limit: 6g
    pids_limit: 256
    stop_grace_period: 15s
    restart: unless-stopped

  ipaper-document-worker:
    # Development release selection; production versions are pinned independently.
    image: ifzzh520/ipaper-document-worker:1.2.0@sha256:2c501ad68bdfc2e282518a813c46e548f598b1af85acc1069058741a45587298
    container_name: ipaper-document-worker
    environment:
      IPAPER_DOCUMENT_JOBS_ROOT: /work/document-jobs
      IPAPER_DOCUMENT_WORKER_TOKEN_FILE: /run/secrets/ipaper_document_worker_token
      IPAPER_MAX_PDF_BYTES: 104857600
      IPAPER_MAX_ARCHIVE_BYTES: 209715200
      IPAPER_MAX_ARCHIVE_EXPANDED_BYTES: 2147483648
      IPAPER_MAX_ARCHIVE_ENTRIES: 2000
      IPAPER_MAX_IMPORT_PAPERS: 500
    volumes:
      - document_jobs:/work/document-jobs
    secrets:
      - source: ipaper_document_worker_token
        target: ipaper_document_worker_token
        uid: "10003"
        gid: "1001"
        mode: 0440
    expose:
      - "7193"
    networks:
      - document_internal
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 2.0
    mem_limit: 3g
    pids_limit: 128
    stop_grace_period: 15s
    restart: unless-stopped

secrets:
  ipaper_worker_token:
    file: /mnt/raid1/projects/ipaper/deploy/ipaper-worker.token
  ipaper_settings_key:
    file: /mnt/raid1/projects/ipaper/deploy/ipaper-settings.key
  ipaper_document_worker_token:
    file: /mnt/raid1/projects/ipaper/deploy/ipaper-document-worker.token

volumes:
  document_jobs:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=3g,uid=10001,gid=1001,mode=2770

networks:
  document_internal:
    internal: true
