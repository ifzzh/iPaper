[project]
name = "ipaper"
version = "1.9.3"
description = "iPaper: A fully open-source, modern paper reading and management platform for Vibe Coding"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {text = "CC BY-NC 4.0"}
authors = [
    {name = "PaperPilot Team"}
]
keywords = ["paper", "research", "pdf", "arxiv", "ai", "translation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "Flask==3.1.3",
    "Werkzeug==3.1.8",
    "arxiv==4.0.1",
    "openai>=1.70.0,<2",
    "requests==2.34.2",
    "cryptography==50.0.1",
    "argon2-cffi==25.1.0",
    "python-dotenv==1.2.3",
]

[project.scripts]
ipaper-auth = "ipaper.auth_cli:main"

[project.optional-dependencies]
local = [] 
web = [
    "gunicorn==26.2.0",
    "jieba==0.42.1",
]
translation = [
    "BabelDOC==0.6.4",
]
document = [
    "PyMuPDF==1.28.2",
    "Pillow==12.3.0",
    "rdflib==7.5.0",
]
server = [
    "mineru[vlm]==3.4.5",
    "mineru[pipeline]==3.4.5",
    "mineru[vllm]==3.4.5",
    "huggingface-hub>=0.20.0",
    "modelscope>=1.17.0",
]
test = [
    "pytest>=8.0.0",
]

[tool.uv]
# Security floors for transitive packages pulled in by MinerU and Flask. Keep
# these explicit so a normal lock refresh cannot silently reintroduce a known
# vulnerable release.
constraint-dependencies = [
    "click>=8.3.3",
    "idna>=3.15",
    "json-repair>=0.60.1",
    "pdfminer-six>=20251230",
    "pydantic-settings>=2.14.2",
    "pypdf>=6.16.1",
    "pygments>=2.20.0",
    "python-multipart>=0.0.31",
    "soupsieve>=2.8.4",
    "urllib3>=2.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that hit live external services such as arXiv",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ipaper"]
